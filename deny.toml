[advisories]
version = 2
ignore = [
    # `paste` sem manutenção (aviso, não vulnerabilidade). Dependência transitiva do iroh/noq;
    # reavaliar a cada atualização do iroh.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-only",
    "Unlicense",           # async_io_stream, pharos, ws_stream_wasm (via iroh)
    "MPL-2.0",             # attohttpc (via iroh); copyleft por arquivo, compatível com AGPL
    "CDLA-Permissive-2.0", # webpki-roots / webpki-root-certs (dados de CAs)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
