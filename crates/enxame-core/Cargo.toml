[package]
name = "enxame-core"
description = "Núcleo do Enxame: identidade, protocolo, sync, carry, papéis e rede."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes = "1"
chacha20poly1305.workspace = true
data-encoding.workspace = true
ed25519-dalek.workspace = true
hkdf.workspace = true
iroh.workspace = true
iroh-blobs.workspace = true
iroh-mdns-address-lookup.workspace = true
keyring = { workspace = true, optional = true }
n0-future.workspace = true
postcard.workspace = true
qrcode.workspace = true
rand.workspace = true
rusqlite.workspace = true
rustls-pki-types.workspace = true
sha2.workspace = true
serde.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
turn.workspace = true
webrtc-util.workspace = true
x25519-dalek.workspace = true

[target.'cfg(windows)'.dependencies]
starship-battery.workspace = true

[features]
default = []
# Keystore do SO (Secret Service / Credential Manager / Keychain). Fora do default para não
# arrastar dependências de desktop ao alvo Android (spec 17.1).
os-keyring = ["dep:keyring"]

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
proptest.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
