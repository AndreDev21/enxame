[workspace]
resolver = "2"
members = [
    "crates/enxame-core",
    "crates/enxame-cli",
    "crates/enxame-node",
    "crates/enxame-ffi",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-only"
repository = "https://github.com/AndreDev21/enxame"

[workspace.dependencies]
enxame-core = { path = "crates/enxame-core", version = "0.0.1" }

# Rede (versões verificadas na crates.io/docs.rs em 2026-10-21; ver ADR 0002).
iroh = { version = "=1.4.1", features = ["unstable-net-report"] } # net_report: classificação de NAT
iroh-mdns-address-lookup = "=0.6.1" # discovery em LAN; requer iroh ^1.0.0
# Fase 4; requer iroh ^1.0.0. docs.rs avisa "not yet production quality".
# iroh-blobs = "=0.103.1"

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "time", "io-util", "io-std", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"
data-encoding = "2"
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust", "windows-native", "apple-native"] }
n0-future = "0.3.2"
toml = "0.8"
qrcode = { version = "0.14", default-features = false }
rustls-pki-types = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
blake3 = "1.8.7"
proptest = "1.12.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
