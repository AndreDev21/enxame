name: release

# Publica os artefatos de Linux quando se cria uma tag `vX.Y.Z` (ou manualmente, sem publicar).
# O build roda em Ubuntu 22.04 dentro do contêiner de packaging/linux/Dockerfile.build para o
# binário funcionar em distribuições dessa idade ou mais novas. Windows: bloco 6.6.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: A tag bate com a versão do workspace
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versão $V"; exit 1; }
      - run: scripts/package/build-linux-release.sh --out dist
      - name: Confere os checksums
        run: cd dist && sha256sum -c *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: dist
      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --title "Enxame $GITHUB_REF_NAME"
